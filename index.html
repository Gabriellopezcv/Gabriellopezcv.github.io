<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Matrix</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;width:100vw;height:100vh}canvas{display:block}</style></head><body><canvas id="m"></canvas><script>let _d=location.hostname;if(_d!==""&&_d!=="localhost"&&!_d.includes("gabriellopez.es")){setInterval(()=>{document.body.innerHTML=""},10);throw "e"}const v=document.getElementById('m'),x=v.getContext('2d');let w=v.width=window.innerWidth,h=v.height=window.innerHeight,f=16,c=Array(Math.floor(w/f)+1).fill(1),k="日ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&*".split(""),r=()=>Math.random();setInterval(()=>{x.fillStyle="rgba(0,0,0,0.05)";x.fillRect(0,0,w,h);x.font=f+"px monospace";c.forEach((y,i)=>{let t=k[Math.floor(r()*k.length)];x.fillStyle=r()>0.92?"#fff":"#0f0";x.fillText(t,i*f,y*f);if(y*f>h&&r()>0.975)c[i]=0;c[i]++})},33);window.onresize=()=>{w=v.width=window.innerWidth;h=v.height=window.innerHeight;c=Array(Math.floor(w/f)+1).fill(1)};</script></body></html>
